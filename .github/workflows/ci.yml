name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (unitários + ponta a ponta)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mercearia
          POSTGRES_PASSWORD: mercearia
          POSTGRES_DB: mercearia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mercearia" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://mercearia:mercearia@localhost:5432/mercearia?schema=public
      JWT_SECRET: ci-segredo-de-teste-com-mais-de-32-caracteres
      DB_ISOLATION: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pacote compartilhado e cliente Prisma
        run: |
          npm run build -w @mercearia/contracts
          npm run db:generate -w @mercearia/api
      - run: npm run typecheck
      - run: npm test
      - name: Migrações e seed
        run: |
          npm run db:deploy
          SEED_ADMIN_EMAIL=ci@mercearia.local SEED_ADMIN_PASSWORD=senha-do-ci-123 npm run db:seed
      - run: ./scripts/build-release.sh
      - name: Ponta a ponta
        run: |
          PORT=3000 FOCUS_NFE_BASE_URL=http://localhost:4996 node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/v1/health && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          E2E_BASE=http://localhost:3000 E2E_DATABASE_URL=$DATABASE_URL \
          E2E_EMAIL=ci@mercearia.local E2E_PASSWORD=senha-do-ci-123 npm run e2e
      - name: Log da API (se falhar)
        if: failure()
        run: cat api.log || true

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mercearia:ci .
