# Publicação da Mercearia Saudável em mercearia.wideic.com, na VPS que já roda o Soul ERP, o VISIO e a Aritana.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Este arquivo NÃO tem proxy próprio: as portas 80/443 da VPS são do Caddy do
# Soul ERP. O contêiner `mercearia-app` entra na rede do Soul e o Caddy de lá
# encaminha mercearia.wideic.com para ele (ver DEPLOY.md, passo 6).
# O banco da Mercearia é separado dos outros sistemas e só existe na rede interna.

services:
  mercearia-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercearia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-mercearia}
    volumes:
      - mercearia_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercearia} -d ${POSTGRES_DB:-mercearia}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    networks: [interna]

  mercearia-app:
    build: .
    restart: unless-stopped
    depends_on:
      mercearia-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mercearia}:${POSTGRES_PASSWORD}@mercearia-db:5432/${POSTGRES_DB:-mercearia}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-12h}
      # Isolamento por organização no banco (RLS). Para voltar atrás sem deploy: DB_ISOLATION=off no .env.
      DB_ISOLATION: ${DB_ISOLATION:-on}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      APP_VERSION: ${APP_VERSION:-fase-1}
      # WhatsApp: Z-API (QR Code) ou API oficial (Meta). Sem as chaves, fica desligado.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_INBOUND_SECRET: ${WHATSAPP_INBOUND_SECRET:-}
      ZAPI_INSTANCE_ID: ${ZAPI_INSTANCE_ID:-}
      ZAPI_TOKEN: ${ZAPI_TOKEN:-}
      ZAPI_CLIENT_TOKEN: ${ZAPI_CLIENT_TOKEN:-}
      META_WA_TOKEN: ${META_WA_TOKEN:-}
      META_WA_PHONE_ID: ${META_WA_PHONE_ID:-}
      META_WA_APP_SECRET: ${META_WA_APP_SECRET:-}
      META_WA_VERIFY_TOKEN: ${META_WA_VERIFY_TOKEN:-}
      # iFood (pedidos), disparos de WhatsApp e arquivo AFD do ponto.
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID:-}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET:-}
      IFOOD_MERCHANT_ID: ${IFOOD_MERCHANT_ID:-}
      IFOOD_STORE_ID: ${IFOOD_STORE_ID:-}
      BROADCAST_INTERVAL_MS: ${BROADCAST_INTERVAL_MS:-4000}
      AFD_INPI: ${AFD_INPI:-}
      TRAFFIC_SECRET: ${TRAFFIC_SECRET:-}
      AFD_DEV_DOC: ${AFD_DEV_DOC:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      # Pagamento online (Mercado Pago). Sem a chave, fica desligado.
      PUBLIC_URL: ${PUBLIC_URL:-https://mercearia.wideic.com}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PAYER_EMAIL: ${MP_PAYER_EMAIL:-}
      PAY_PROVIDER: ${PAY_PROVIDER:-}
      # Assistente (Claude). Sem ANTHROPIC_API_KEY, o assistente fica desligado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      IA_MODELO_ASSISTENTE: ${IA_MODELO_ASSISTENTE:-}
      IA_MODELO_TRIAGEM: ${IA_MODELO_TRIAGEM:-}
      # Voz: OpenAI (transcrever o microfone e falar) e ElevenLabs (voz mais natural). Opcionais.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # E-mail das rotinas do assistente (SMTP). Vazio = envio só simulado.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_SUPORTE: ${EMAIL_SUPORTE:-}
      ASSISTENTE_INTERVALO_LOTE_S: ${ASSISTENTE_INTERVALO_LOTE_S:-20}
      PORT: 3000
    expose:
      - "3000"
    mem_limit: 768m
    networks: [interna, soul]

volumes:
  mercearia_pgdata:

networks:
  interna:
  # Rede do Soul ERP, onde está o Caddy. Confira o nome com: docker network ls
  soul:
    external: true
    name: ${SOUL_NETWORK:-erp_default}
